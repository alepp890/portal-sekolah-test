<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pengujian Log Masuk</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <!-- Header -->
    <div class="bg-blue-700 p-6 text-center text-white">
      <div class="inline-flex p-3 bg-blue-800/60 rounded-full mb-3">
        <i class="fa-solid fa-shield-halved text-3xl text-yellow-400"></i>
      </div>
      <h1 class="text-2xl font-bold">Portal Pengujian</h1>
      <p class="text-xs text-blue-100 mt-1">Log Masuk Modular & Heterogen</p>
    </div>

    <!-- Borang Input -->
    <div class="p-6 space-y-4">
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-gray-700">Emel / ID DELIMa / Personal:</label>
        <input type="email" id="emailInput" placeholder="g-12345678@moe-dl.edu.my / gmail" class="w-full text-xs border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-gray-700">Kata Laluan (Khusus Akaun Personal/Manual):</label>
        <input type="password" id="passInput" placeholder="Masukkan katalaluan" class="w-full text-xs border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button onclick="prosesLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Log Masuk Portal
      </button>

      <!-- Mesej Status / Ralat -->
      <div id="msg" class="text-xs text-center p-3 rounded-lg hidden font-medium"></div>
    </div>

    <div class="bg-slate-50 p-3 text-center border-t border-slate-200 text-[10px] text-gray-400">
      GitHub Pages + Google Apps Script API Test
    </div>
  </div>

  <script>
    // URL Web App Apps Script anda yang telah dimasukkan siap-siap!
    const API_URL = "https://script.google.com/macros/s/AKfycbwUoxY1zoaW9NnI3oZkjSUlJ38K01nRtROoNmDYWpA0WKwnAIRQO0rs1c-KhMXSB6Ch/exec";

    async function prosesLogin() {
      const email = document.getElementById("emailInput").value.trim();
      const pass = document.getElementById("passInput").value.trim();
      const msg = document.getElementById("msg");

      if (!email) {
        msg.className = "text-xs text-center p-3 rounded-lg font-medium bg-red-50 text-red-600 border border-red-200";
        msg.innerText = "Sila masukkan emel anda!";
        msg.classList.remove("hidden");
        return;
      }

      msg.className = "text-xs text-center p-3 rounded-lg font-medium bg-blue-50 text-blue-600 border border-blue-200";
      msg.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengesahkan akaun...';
      msg.classList.remove("hidden");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: pass ? "checkManualLogin" : "checkGoogleLogin",
            email: email,
            password: pass
          })
        });

        const res = await response.json();

        if (res.success) {
          msg.className = "text-xs text-center p-3 rounded-lg font-medium bg-green-50 text-green-600 border border-green-200";
          msg.innerText = "Pengesahan Berjaya! Mengalih ke dashboard...";

          // Simpan data profil dalam memori browser
          sessionStorage.setItem("userProfile", JSON.stringify(res));

          // Alih ke fail dashboard mengikut peranan
          setTimeout(() => {
            window.location.href = res.redirect;
          }, 1000);

        } else {
          msg.className = "text-xs text-center p-3 rounded-lg font-medium bg-red-50 text-red-600 border border-red-200";
          msg.innerText = res.message;
        }
      } catch (err) {
        msg.className = "text-xs text-center p-3 rounded-lg font-medium bg-red-50 text-red-600 border border-red-200";
        msg.innerText = "Ralat Sambungan: " + err.message;
      }
    }
  </script>
</body>
</html>
