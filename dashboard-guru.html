<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru & Pentadbir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-purple-50 min-h-screen p-4 flex justify-center items-center font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-purple-200">
    <!-- Header Guru -->
    <div class="bg-purple-700 p-6 text-center text-white">
      <span class="px-3 py-1 bg-purple-800 text-purple-200 text-[10px] font-bold uppercase rounded-full tracking-wider">
        Portal Pentadbiran & Guru
      </span>
      <h1 class="text-2xl font-bold mt-2" id="namaUser">Selamat Datang, Cikgu</h1>
      <p class="text-xs text-purple-200 mt-1" id="emailUser"></p>
    </div>

    <!-- Kandungan Modul Guru -->
    <div class="p-6 space-y-4">
      <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 text-xs space-y-2">
        <p class="text-purple-900"><strong>Peranan:</strong> <span id="perananUser">-</span></p>
        <p class="text-purple-700">Akses dibuka untuk Pengurusan PBD, Bank Soalan, dan Jadual PdPR.</p>
      </div>

      <!-- Kad Navigasi Pilihan (Contoh Modul) -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button class="p-3 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-2 transition">
          <i class="fa-solid fa-file-pen text-lg"></i> Modul PBD
        </button>
        <button class="p-3 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-2 transition">
          <i class="fa-solid fa-folder-open text-lg"></i> Bank Soalan
        </button>
      </div>

      <!-- Butang Keluar -->
      <button onclick="logout()" class="w-full mt-4 bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2.5 rounded-xl border border-red-200 transition text-xs flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> Log Keluar
      </button>
    </div>
  </div>

  <script>
    // Semak kebenaran akses semasa halaman dibuka
    const user = JSON.parse(sessionStorage.getItem("userProfile"));

    // Jika tiada session atau peranan bukan Guru, kembalikan ke index.html
    if (!user || user.role !== "Guru") {
      window.location.href = "index.html";
    } else {
      document.getElementById("namaUser").innerText = user.nama;
      document.getElementById("emailUser").innerText = user.email;
      document.getElementById("perananUser").innerText = user.peranan;
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
