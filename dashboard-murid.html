<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-emerald-50 min-h-screen p-4 flex justify-center items-center font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-emerald-200">
    <!-- Header Murid -->
    <div class="bg-emerald-600 p-6 text-center text-white">
      <span class="px-3 py-1 bg-emerald-700 text-emerald-100 text-[10px] font-bold uppercase rounded-full tracking-wider">
        Portal Pembelajaran Murid
      </span>
      <h1 class="text-2xl font-bold mt-2" id="namaUser">Selamat Datang</h1>
      <p class="text-xs text-emerald-100 mt-1" id="emailUser"></p>
    </div>

    <!-- Kandungan Modul Murid -->
    <div class="p-6 space-y-4">
      <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100 text-xs space-y-2">
        <p class="text-emerald-900"><strong>Kelas:</strong> <span id="kelasUser">-</span></p>
        <p class="text-emerald-700">Akses dibuka untuk Bahan Tugasan PdPR dan Semakan Keputusan PBD.</p>
      </div>

      <!-- Kad Navigasi Pilihan (Contoh Modul) -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button class="p-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-2 transition">
          <i class="fa-solid fa-book-open text-lg"></i> Bahan PdPR
        </button>
        <button class="p-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-2 transition">
          <i class="fa-solid fa-award text-lg"></i> Keputusan PBD
        </button>
      </div>

      <!-- Butang Keluar -->
      <button onclick="logout()" class="w-full mt-4 bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2.5 rounded-xl border border-red-200 transition text-xs flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> Log Keluar
      </button>
    </div>
  </div>

  <script>
    // Semak kebenaran akses semasa halaman dibuka
    const user = JSON.parse(sessionStorage.getItem("userProfile"));

    // Jika tiada session atau peranan bukan Murid, kembalikan ke index.html
    if (!user || user.role !== "Murid") {
      window.location.href = "index.html";
    } else {
      document.getElementById("namaUser").innerText = user.nama;
      document.getElementById("emailUser").innerText = user.email;
      document.getElementById("kelasUser").innerText = user.kelas;
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
